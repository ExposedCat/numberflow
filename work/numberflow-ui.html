<div id="numberflow-design" aria-label="Numberflow interface direction">
  <style>
    #numberflow-design {
      --nf-canvas: light-dark(#eeece6, #23221f);
      --nf-surface: light-dark(#faf9f5, #32312d);
      --nf-text: light-dark(#36342f, #eae7df);
      --nf-muted: light-dark(#79766f, #aaa69b);
      --nf-border: light-dark(#dedbd3, #45433d);
      --nf-soft: light-dark(#eae7df, #3d3b35);
      --nf-accent: light-dark(#4c4941, #d6d1c4);
      --nf-active: light-dark(#eae7df, #45423a);
      --nf-dot: light-dark(#d5d1c7, #3c3a33);
      --nf-pink: light-dark(#8b8271, #aaa28f);
      --nf-cyan: light-dark(#c4bcaa, #c4bcaa);
      --nf-output: light-dark(#48463f, #d4cdbc);
      --nf-output-text: light-dark(#f5f2e9, #35332c);
      --nf-danger: light-dark(#8b554c, #c29a8f);
      --nf-shadow: 0 2px 4px #2621180a, 0 12px 26px #2621180c;
      --nf-radius: 16px;
      font-family: ui-sans-serif, system-ui, sans-serif;
      color: var(--nf-text);
      font-size: 14px;
      width: 100%;
    }
    #numberflow-design * { box-sizing: border-box; }
    #numberflow-design button, #numberflow-design input, #numberflow-design textarea { font: inherit; }
    #numberflow-design button { color: inherit; cursor: pointer; }
    #numberflow-design button:disabled { opacity: .35; cursor: not-allowed; }
    #numberflow-design .nf-window { background: var(--nf-canvas); border: 0; border-radius: 22px; overflow: hidden; }
    #numberflow-design .nf-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 20px 24px 8px; background: transparent; }
    #numberflow-design .nf-header-left, #numberflow-design .nf-toolbar { display: flex; align-items: center; gap: 8px; min-width: 0; }
    #numberflow-design .nf-brand { font-weight: 500; margin-right: 12px; color: var(--nf-muted); }
    #numberflow-design .nf-toolbar { padding: 4px; background: var(--nf-soft); border-radius: 14px; gap: 3px; }
    #numberflow-design .nf-control { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 36px; border-radius: 11px; padding: 7px 10px; border: 0; background: var(--nf-surface); white-space: nowrap; }
    #numberflow-design .nf-toolbar .nf-control { background: transparent; color: var(--nf-muted); }
    #numberflow-design .nf-control:hover { background: var(--nf-soft); }
    #numberflow-design .nf-control[aria-pressed="true"] { color: var(--nf-text); background: var(--nf-surface); box-shadow: 0 1px 3px #2621180c; }
    #numberflow-design .nf-control[aria-expanded="true"] { color: var(--nf-text); background: var(--nf-surface); }
    #numberflow-design .nf-icon { padding: 7px; min-width: 34px; flex-shrink: 0; }
    #numberflow-design svg[data-lucide], #numberflow-design [data-lucide] { width: 16px; height: 16px; flex-shrink: 0; }
    #numberflow-design .nf-workspace { position: relative; min-height: 450px; padding: 40px 42px 60px; background-image: radial-gradient(var(--nf-dot) .75px, transparent .75px); background-size: 28px 28px; }
    #numberflow-design .nf-page-menu { position: absolute; left: 24px; top: 6px; width: 245px; z-index: 4; background: var(--nf-surface); border: 1px solid var(--nf-border); border-radius: var(--nf-radius); box-shadow: var(--nf-shadow); padding: 8px; }
    #numberflow-design .nf-menu-label { padding: 8px; color: var(--nf-muted); font-size: 12px; }
    #numberflow-design .nf-page-row { display: flex; align-items: center; gap: 4px; }
    #numberflow-design .nf-menu-item { display: flex; align-items: center; gap: 8px; border: 0; border-radius: calc(var(--nf-radius) - 2px); padding: 9px 8px; min-height: 36px; background: transparent; text-align: left; }
    #numberflow-design .nf-menu-item:hover { background: var(--nf-soft); }
    #numberflow-design .nf-page-choice { flex: 1; }
    #numberflow-design .nf-page-choice[aria-current="page"] { color: var(--nf-text); background: var(--nf-active); }
    #numberflow-design .nf-page-choice span { flex: 1; }
    #numberflow-design .nf-delete { color: var(--nf-danger); }
    #numberflow-design .nf-create { border-top: 1px solid var(--nf-border); padding-top: 6px; margin-top: 6px; }
    #numberflow-design .nf-create > button { width: 100%; }
    #numberflow-design .nf-name-form { padding: 6px; display: flex; gap: 6px; }
    #numberflow-design .nf-name-form[hidden], #numberflow-design [hidden] { display: none; }
    #numberflow-design .nf-name-form input { width: 100%; min-width: 0; border: 1px solid var(--nf-border); border-radius: var(--nf-radius); padding: 7px; background: var(--nf-surface); color: var(--nf-text); }
    #numberflow-design .nf-graph { position: relative; display: grid; grid-template-columns: 180px 210px; justify-content: center; column-gap: clamp(75px, 15vw, 220px); align-items: center; margin-top: 92px; min-height: 220px; }
    #numberflow-design .nf-inputs { display: flex; flex-direction: column; gap: 32px; }
    #numberflow-design .nf-edges { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
    #numberflow-design .nf-edges path { stroke: var(--nf-muted); opacity: .6; stroke-width: 1.4; fill: none; }
    #numberflow-design .nf-node { display: block; text-align: left; position: relative; width: 100%; border: 0; border-radius: var(--nf-radius); padding: 18px 20px; background: var(--nf-surface); box-shadow: 0 2px 2px #2621180a, 0 5px 12px #26211806; }
    #numberflow-design .nf-node:hover { box-shadow: 0 2px 2px #2621180a, 0 5px 12px #26211812; }
    #numberflow-design .nf-node[aria-expanded="true"] { box-shadow: 0 0 0 2px var(--nf-accent); }
    #numberflow-design .nf-node-label { color: var(--nf-muted); display: block; font-size: 12px; margin-bottom: 7px; }
    #numberflow-design .nf-node-value { display: block; font-family: ui-monospace, monospace; font-size: 24px; font-weight: 400; font-variant-numeric: tabular-nums; letter-spacing: -.6px; }
    #numberflow-design .nf-node-expression { display: block; margin-top: 6px; font-family: ui-monospace, monospace; font-size: 12px; color: var(--nf-muted); }
    #numberflow-design .nf-output-node { background: var(--nf-output); color: var(--nf-output-text); }
    #numberflow-design .nf-output-node .nf-node-label { color: var(--nf-output-text); opacity: .75; }
    #numberflow-design .nf-port { position: absolute; width: 8px; height: 8px; border-radius: 50%; border: 2px solid var(--nf-surface); background: var(--nf-pink); top: calc(50% - 4px); right: -4px; }
    #numberflow-design .nf-target-port { left: -4px; right: auto; background: var(--nf-output-text); border-color: var(--nf-output); }
    #numberflow-design .nf-target-b { top: 65%; }
    #numberflow-design .nf-target-a { top: 35%; }
    #numberflow-design .nf-node-expression, #numberflow-design .nf-expression-x, #numberflow-design .nf-expression-y { color: var(--nf-output-text); opacity: .8; }
    #numberflow-design .nf-editor { position: relative; background: var(--nf-surface); border: 1px solid var(--nf-border); border-radius: var(--nf-radius); box-shadow: var(--nf-shadow); padding: 12px; width: min(360px, 100%); margin: 20px auto 0; z-index: 3; }
    #numberflow-design .nf-editor-title { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
    #numberflow-design .nf-editor textarea { display: block; width: 100%; background: var(--nf-canvas); color: var(--nf-text); border: 1px solid var(--nf-border); border-radius: calc(var(--nf-radius) - 2px); resize: vertical; padding: 10px; min-height: 70px; font-family: ui-monospace, monospace; }
    #numberflow-design .nf-editor-footer { margin-top: 8px; display: flex; justify-content: space-between; align-items: center; color: var(--nf-muted); font-size: 12px; }
    #numberflow-design .nf-editor .nf-delete { border: 0; background: transparent; }
    #numberflow-design .nf-hint { position: absolute; bottom: 18px; left: 16px; right: 16px; color: var(--nf-muted); font-size: 12px; text-align: center; }
    @media (max-width: 600px) {
      #numberflow-design .nf-brand { display: none; }
      #numberflow-design .nf-header { padding: 14px 12px 6px; gap: 5px; }
      #numberflow-design .nf-toolbar { gap: 5px; }
      #numberflow-design .nf-control { padding: 7px; }
      #numberflow-design .nf-workspace { padding: 24px 25px 65px; }
      #numberflow-design .nf-graph { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 35px; margin-top: 135px; }
      #numberflow-design .nf-node { padding: 12px; }
      #numberflow-design .nf-node-value { font-size: 21px; }
      #numberflow-design .nf-page-menu { left: 10px; }
      #numberflow-design .nf-node-expression { white-space: normal; }
    }
    @media (max-width: 380px) {
      #numberflow-design .nf-reposition-label { display: none; }
    }
    @media (pointer: coarse) {
      #numberflow-design .nf-control, #numberflow-design .nf-menu-item { min-height: 44px; }
    }
  </style>
  <div class="nf-window">
    <header class="nf-header">
      <div class="nf-header-left">
        <span class="nf-brand">numberflow</span>
        <button type="button" class="nf-control nf-page-trigger" aria-expanded="false" aria-controls="nf-page-menu"><i data-lucide="file" aria-hidden="true"></i><span>Budget</span><i data-lucide="chevron-down" aria-hidden="true"></i></button>
      </div>
      <div class="nf-toolbar">
        <button type="button" class="nf-control nf-snap" aria-pressed="true"><i data-lucide="grid-3x3" aria-hidden="true"></i>Snap</button>
        <button type="button" class="nf-control nf-reposition" aria-label="Reposition" title="Reposition nodes"><i data-lucide="move" aria-hidden="true"></i><span class="nf-reposition-label">Reposition</span></button>
      </div>
    </header>
    <main class="nf-workspace">
      <div id="nf-page-menu" class="nf-page-menu" hidden>
        <div class="nf-menu-label">Pages</div>
        <nav aria-label="Pages" class="nf-page-list"></nav>
        <div class="nf-create">
          <button type="button" class="nf-menu-item nf-create-trigger"><i data-lucide="plus" aria-hidden="true"></i>New page</button>
          <form class="nf-name-form" hidden><input aria-label="Page name" placeholder="Page name" maxlength="60"><button type="submit" class="nf-control nf-icon" aria-label="Create page"><i data-lucide="plus" aria-hidden="true"></i></button></form>
        </div>
      </div>
      <div class="nf-graph">
        <svg class="nf-edges" aria-label="Salary and expenses connect to remaining balance" role="img"><path class="nf-edge-a"></path><path class="nf-edge-b"></path></svg>
        <div class="nf-inputs">
          <button type="button" class="nf-node nf-input-node" data-node="salary" aria-expanded="false"><span class="nf-node-label">Salary</span><span class="nf-node-value">3,200</span><span class="nf-port" aria-hidden="true"></span></button>
          <button type="button" class="nf-node nf-input-node" data-node="expenses" aria-expanded="false"><span class="nf-node-label">Expenses</span><span class="nf-node-value">1,100</span><span class="nf-port" aria-hidden="true"></span></button>
        </div>
        <button type="button" class="nf-node nf-output-node" data-node="remaining" aria-expanded="false"><span class="nf-node-label">Remaining</span><span class="nf-node-value">2,100</span><span class="nf-node-expression"><span class="nf-expression-x">x</span> − <span class="nf-expression-y">y</span></span><span class="nf-port nf-target-port nf-target-a" aria-hidden="true"></span><span class="nf-port nf-target-port nf-target-b" aria-hidden="true"></span></button>
      </div>
      <section class="nf-editor" aria-label="Expression editor" hidden>
        <div class="nf-editor-title"><label for="nf-expression">Expression</label><button type="button" class="nf-control nf-icon nf-close-editor" aria-label="Close editor"><i data-lucide="x" aria-hidden="true"></i></button></div>
        <textarea id="nf-expression" spellcheck="false"></textarea>
        <div class="nf-editor-footer"><span>Enter to finish</span><button type="button" class="nf-control nf-icon nf-delete" aria-label="Remove node"><i data-lucide="trash-2" aria-hidden="true"></i></button></div>
      </section>
      <div class="nf-hint">Double-click to add a number · Click a number to edit</div>
      <span class="nf-announcement" aria-live="polite" style="position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)"></span>
    </main>
  </div>
  <script>
    (() => {
      const root = document.getElementById('numberflow-design');
      const state = { direction: 'Paper', radius: 16 };
      const pages = [{name:'Budget',salary:'3200',expenses:'1100'},{name:'Untitled',salary:'0',expenses:'0'}];
      let pageIndex = 0;
      let editing = null;
      const menu = root.querySelector('.nf-page-menu');
      const trigger = root.querySelector('.nf-page-trigger');
      const editor = root.querySelector('.nf-editor');
      const textarea = root.querySelector('textarea');
      const announce = text => root.querySelector('.nf-announcement').textContent = text;
      const themes = {
        'Paper': {canvas:'light-dark(#eeece6, #23221f)',surface:'light-dark(#faf9f5, #32312d)',text:'light-dark(#36342f, #eae7df)',muted:'light-dark(#79766f, #aaa69b)',border:'light-dark(#dedbd3, #45433d)',soft:'light-dark(#eae7df, #3d3b35)',dot:'light-dark(#d5d1c7, #3c3a33)',accent:'light-dark(#4c4941, #d6d1c4)',active:'light-dark(#eae7df, #45423a)',output:'light-dark(#48463f, #d4cdbc)','output-text':'light-dark(#f5f2e9, #35332c)'},
        'Graphite': {canvas:'light-dark(#e9e9e7, #252525)',surface:'light-dark(#f8f8f6, #343434)',text:'light-dark(#353535, #e5e5e1)',muted:'light-dark(#777773, #aaa9a2)',border:'light-dark(#d8d8d3, #454543)',soft:'light-dark(#e0e0dc, #3e3e3b)',dot:'light-dark(#cececa, #3b3b39)',accent:'light-dark(#50504c, #d2d2cb)',active:'light-dark(#e4e4df, #484842)',output:'light-dark(#464643, #d0d0c7)','output-text':'light-dark(#f0f0ea, #32322f)'}
      };
      function drawEdges() {
        const graph = root.querySelector('.nf-graph');
        const box = graph.getBoundingClientRect();
        if (!box.width) return;
        const target = root.querySelector('[data-node="remaining"]');
        const to = target.getBoundingClientRect();
        ['salary','expenses'].forEach((key,index) => {
          const source = root.querySelector(`[data-node="${key}"]`).getBoundingClientRect();
          const x1 = source.right - box.left, y1 = source.top + source.height/2 - box.top;
          const x2 = to.left-box.left, y2 = to.top + to.height*(index ? .65 : .35) - box.top;
          const bend = (x2-x1)*.5;
          root.querySelector(index ? '.nf-edge-b' : '.nf-edge-a').setAttribute('d',`M${x1},${y1} C${x1+bend},${y1} ${x2-bend},${y2} ${x2},${y2}`);
        });
      }
      function renderTheme() {
        Object.entries(themes[state.direction]).forEach(([key,value]) => root.style.setProperty(`--nf-${key}`,value));
        root.style.setProperty('--nf-radius',`${state.radius}px`);
        drawEdges();
      }
      function setMenu(open) {menu.hidden=!open;trigger.setAttribute('aria-expanded',String(open));}
      function renderPages() {
        const list = root.querySelector('.nf-page-list');
        list.replaceChildren();
        pages.forEach((page,index) => {
          const row = document.createElement('div');row.className='nf-page-row';
          const button = document.createElement('button');button.type='button';button.className='nf-menu-item nf-page-choice';
          if(index===pageIndex)button.setAttribute('aria-current','page');
          const icon=document.createElement('i');icon.setAttribute('data-lucide','file');icon.setAttribute('aria-hidden','true');
          const label=document.createElement('span');label.textContent=page.name;button.append(icon,label);
          if(index===pageIndex){const check=document.createElement('i');check.setAttribute('data-lucide','check');check.setAttribute('aria-hidden','true');button.append(check);}
          button.onclick=()=>{pageIndex=index;renderPages();renderNumbers();closeEditor();setMenu(false);};
          const remove=document.createElement('button');remove.type='button';remove.className='nf-menu-item nf-delete';remove.setAttribute('aria-label',`Delete ${page.name}`);remove.disabled=pages.length===1;
          const trash=document.createElement('i');trash.setAttribute('data-lucide','trash-2');trash.setAttribute('aria-hidden','true');remove.append(trash);
          remove.onclick=()=>{pages.splice(index,1);pageIndex=Math.min(pageIndex,pages.length-1);renderPages();renderNumbers();closeEditor();announce('Page deleted');};
          row.append(button,remove);list.append(row);
        });
        trigger.querySelector('span').textContent=pages[pageIndex].name;
        if(globalThis.lucide)lucide.createIcons({attrs:{width:16,height:16}});
      }
      function renderNumbers(){
        const page=pages[pageIndex];
        const salary=Number(page.salary)||0, expenses=Number(page.expenses)||0;
        [['salary',salary],['expenses',expenses],['remaining',salary-expenses]].forEach(([key,value])=>root.querySelector(`[data-node="${key}"] .nf-node-value`).textContent=value.toLocaleString());
        drawEdges();
      }
      function closeEditor(){editor.hidden=true;editing=null;root.querySelectorAll('[data-node]').forEach(node=>node.setAttribute('aria-expanded','false'));}
      trigger.onclick=()=>setMenu(menu.hidden);
      root.querySelector('.nf-snap').onclick=event=>{const button=event.currentTarget;button.setAttribute('aria-pressed',String(button.getAttribute('aria-pressed')!=='true'));};
      root.querySelector('.nf-reposition').onclick=()=>{root.querySelector('.nf-graph').style.columnGap='';drawEdges();announce('Nodes aligned');};
      root.querySelector('.nf-create-trigger').onclick=()=>{const form=root.querySelector('.nf-name-form');form.hidden=!form.hidden;if(!form.hidden)form.querySelector('input').focus();};
      root.querySelector('.nf-name-form').onsubmit=event=>{event.preventDefault();const input=event.currentTarget.querySelector('input');pages.push({name:input.value.trim()||`Page ${pages.length+1}`,salary:'0',expenses:'0'});pageIndex=pages.length-1;input.value='';event.currentTarget.hidden=true;renderPages();renderNumbers();closeEditor();setMenu(false);};
      root.querySelectorAll('[data-node]').forEach(node=>node.onclick=()=>{
        closeEditor();editing=node.dataset.node;node.setAttribute('aria-expanded','true');setMenu(false);
        textarea.value=editing==='remaining'?'x - y':pages[pageIndex][editing];
        textarea.readOnly=editing==='remaining';editor.hidden=false;textarea.focus();
      });
      textarea.oninput=()=>{if(editing&&editing!=='remaining'){pages[pageIndex][editing]=textarea.value;renderNumbers();}};
      textarea.onkeydown=event=>{if((event.key==='Enter'&&!event.shiftKey)||event.key==='Escape'){event.preventDefault();closeEditor();}};
      root.querySelector('.nf-close-editor').onclick=closeEditor;
      root.querySelector('.nf-editor .nf-delete').onclick=()=>{if(editing&&editing!=='remaining'){pages[pageIndex][editing]='0';renderNumbers();}closeEditor();};
      root.onkeydown=event=>{if(event.key==='Escape'){setMenu(false);closeEditor();}};
      root.querySelector('.nf-workspace').addEventListener('click',event=>{if(event.target===event.currentTarget){setMenu(false);closeEditor();}});
      renderTheme();renderPages();renderNumbers();
      new ResizeObserver(drawEdges).observe(root.querySelector('.nf-graph'));
      if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:renderTheme});tweak.addSelect(state,'direction',{label:'Visual direction',options:['Paper','Graphite']});tweak.addSlider(state,'radius',{label:'Corner radius',min:12,max:22,unit:'px'});}
    })();
  </script>
</div>
